<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Atmospheric 3D Parallax Moving Background for Endless Running Game in HTML5, CSS, and JavaScript. Autumn foggy forest vibes.">
  <title>Autumn Forest Run</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <!-- Main Game Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Top Left Pause Button -->
    <header class="top-header">
      <button id="btn-pause" class="btn btn-icon" title="Pause Game">
        <span>⏸</span>
      </button>
      <div class="level-title">Autumn Forest Run</div>
    </header>

    <!-- Top Right Score Panel -->
    <div class="score-panel">
      <div class="score-item">
        <span class="label">HIGH SCORE</span>
        <span id="high-score" class="value">0</span>
      </div>
      <div class="divider-vertical"></div>
      <div class="score-item">
        <span class="label">SCORE</span>
        <span id="current-score" class="value">0</span>
      </div>
    </div>

    <!-- Game Over / Victory Overlay -->
    <div id="game-overlay" class="overlay hidden">
      <h1 id="overlay-title">Level Complete!</h1>
      <p id="overlay-message">You reached 500 points.</p>
      <button id="btn-restart" class="btn btn-large">Play Again</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="background.js"></script>
  <script src="game.js"></script>
  <script src="main.js"></script>
</body>
</html>
